# CI — Phase 3 工程质量底座
#
# 三个独立 job:
#   1. backend-tests    — 全量 pytest(sqlite + fakeredis),排除 docs/PROGRESS.md
#                          记录的 6 个预存基线/网络文件 + 1 个 flaky 用例
#   2. pg-migration-smoke — 真 Postgres(pgvector)全链 alembic 迁移 + 注册冒烟。
#                          动机见 PROGRESS 发现区:sqlite 测试(FK 不强制 +
#                          create_all 不走迁移)曾掩盖 4 类"仅真 PG 会炸"的 bug
#   3. frontend         — tsc + vitest + eslint 基线闸门(7err/3warn 零新增)+ build
name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest (sqlite + fakeredis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]" pytest-timeout
      - name: Run selective suite
        # 排除清单与 docs/PROGRESS.md 的"全量选择性套件"口径一致:
        # import/map_integration/research_stage/resident_edit 需要外网/LLM,
        # portrait/preset_import 是记录在案的测试-代码漂移;
        # forge_answers_advance_to_generating 的后台 LLM 任务无外网时挂起。
        # 修复任何一项后请同步收窄这里的排除。
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/ci_dev.db
        run: >
          pytest tests -q
          --timeout=120 --timeout-method=signal
          --ignore=tests/test_import.py
          --ignore=tests/test_map_integration.py
          --ignore=tests/test_research_stage.py
          --ignore=tests/test_resident_edit.py
          --ignore=tests/test_portrait.py
          --ignore=tests/test_preset_import.py
          --deselect tests/test_forge.py::test_forge_answers_advance_to_generating

  pg-migration-smoke:
    name: Backend · PG 全链迁移 + 注册冒烟 (pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skills_world
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/skills_world
      REDIS_URL: redis://localhost:6379/0
      # 真实长度密钥让 P0-4b 守卫按生产语义放行(DEBUG 不开)
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      RUN_BACKGROUND_TASKS: 'false'
      AGENT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Alembic full-chain upgrade on real PG
        run: alembic upgrade head
      - name: Boot API + register smoke
        # 覆盖 vm212 曾暴露的 bug 类:FK 插入顺序 / 迁移类型漂移 / vector 列类型。
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          resp=$(curl -fsS -X POST http://127.0.0.1:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke","email":"ci-smoke@example.com","password":"ci-password-123"}')
          echo "$resp" | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('token'), d; print('register smoke OK')"

  frontend:
    name: Frontend · tsc + vitest + eslint 基线 + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # rolldown 原生 binding 在 Node v25 下缺失(PROGRESS 记录),锁 22 LTS
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: ESLint baseline gate
        # 基线 7 errors / 3 warnings 全部预存(setState-in-effect 等非平凡修复),
        # 闸门语义 = "零新增"。修掉存量后请同步下调基线数字。
        run: |
          npx eslint src --format json --output-file /tmp/eslint.json || true
          node -e "
            const fs = require('fs');
            const BASELINE_ERRORS = 7, BASELINE_WARNINGS = 3;
            const results = JSON.parse(fs.readFileSync('/tmp/eslint.json', 'utf8'));
            const errors = results.reduce((s, f) => s + f.errorCount, 0);
            const warnings = results.reduce((s, f) => s + f.warningCount, 0);
            console.log(\`eslint: \${errors} errors / \${warnings} warnings (baseline \${BASELINE_ERRORS}/\${BASELINE_WARNINGS})\`);
            if (errors > BASELINE_ERRORS || warnings > BASELINE_WARNINGS) {
              console.error('New lint problems introduced over the recorded baseline.');
              process.exit(1);
            }
          "
      - name: Build
        run: npm run build
