events {}

http {
  server {
    listen 8097;
    client_max_body_size 1m;

    location / {
      proxy_pass http://codex-runtime:8097;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 1300s;
      proxy_set_header Host $host;
    }
  }
}
