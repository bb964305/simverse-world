[project]
name = "skills-world-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "redis>=5.2",
    "anthropic>=0.42",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk>=2.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "anyio[trio]>=4.0", "aiosqlite>=0.20", "fakeredis>=2.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "lab_oci: real-container OCI isolation evidence (colima = dev-grade; excluded from the default gate — opt in with `-m lab_oci`)",
    "lab_postgres: required disposable real-Postgres release evidence",
    "lab_redis: required isolated real-Redis release evidence",
    "lab_staging: required live isolated-service staging evidence",
    "lab_capacity: required fixed-seed release-capacity evidence",
]
addopts = "-m 'not lab_oci'"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
