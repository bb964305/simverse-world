[project]
name = "skills-world-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "redis>=5.2",
    "anthropic>=0.42",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk>=2.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "anyio[trio]>=4.0", "aiosqlite>=0.20", "fakeredis>=2.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "lab_oci: real-container OCI isolation evidence (colima = dev-grade; excluded from the default gate — opt in with `-m lab_oci`)",
    "lab_postgres: required disposable real-Postgres release evidence",
    "lab_redis: required isolated real-Redis release evidence",
    "lab_staging: required live isolated-service staging evidence",
    "lab_capacity: required fixed-seed release-capacity evidence",
    "economy_postgres: required real-Postgres concurrency evidence for the M-A economy (carry / stock races)",
]
# 默认门 = 一台只有 Python 和本仓依赖的机器上跑得过的那些。五个 marker 全部需要
# 外部环境（真 PG / 真 Redis / 活的 staging 服务 / 真容器），用 `-m lab_xxx` 显式
# opt-in。一致性由 tests/test_pytest_default_selection.py 守住——marker 加进上面
# 的列表却忘了在这里选边，那道断言会红。
addopts = "-m 'not lab_oci and not lab_postgres and not lab_redis and not lab_staging and not lab_capacity and not economy_postgres'"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
